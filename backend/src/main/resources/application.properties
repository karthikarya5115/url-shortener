spring.application.name=url-shortener

# Database Configuration
# Fallback to H2 for local development, but use environment variables if provided
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Configuration
# Render provides the port via the PORT environment variable
server.port=${PORT:8080}

